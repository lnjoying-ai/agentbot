server:
  ip: 127.0.0.1
  port: 8080

agentbot:
  heartbeatFile: "HEARTBEAT.md"

  channels:
    feishu:
      enabled: false
      appId: ""
      appSecret: ""
      verificationToken: ""
      encryptKey: ""
      domain: "https://open.feishu.cn"
      autoReconnect: true
      # inbound via Feishu WebSocket
    telegram:
      enabled: false
      token: ""
      pollSeconds: 2
    whatsapp:
      enabled: false
      bridgeUrl: "ws://127.0.0.1:3001"
    wechat:
      enabled: false
      appId: ""
      appSecret: ""
      token: ""
      aesKey: ""
    discord:
      enabled: false
      botToken: ""
      gatewayUrl: "wss://gateway.discord.gg/?v=10&encoding=json"
      intents: 513
      reconnectIntervalSeconds: 5
      # inbound webhook: POST /webhook/discord
    maixcam:
      enabled: false
      host: "0.0.0.0"
      port: 19032
      # device TCP ingress
    qq:
      enabled: false
      appId: ""
      appSecret: ""
      botToken: ""
      apiBaseUrl: "https://api.sgroup.qq.com"
      wsUrl: "wss://api.sgroup.qq.com/websocket"
      intents: 1
      shardId: 0
      shardCount: 1
      reconnectIntervalSeconds: 5
      # inbound webhook: POST /webhook/qq
    dingtalk:
      enabled: false
      appKey: ""
      appSecret: ""
      token: ""
      aesKey: ""
      # stream mode via WebSocket (DingTalk Stream SDK)
      webhookUrl: ""
      webhookSecret: ""
      apiBaseUrl: "https://oapi.dingtalk.com"
      # inbound stream: DingTalk Stream topics
    slack:
      enabled: false
      botToken: ""
      signingSecret: ""
      # inbound webhook: POST /webhook/slack
    line:
      enabled: false
      channelSecret: ""
      channelAccessToken: ""
      # inbound webhook: POST /webhook/line (X-Line-Signature)
    onebot:
      enabled: false
      wsUrl: ""
      accessToken: ""
      reconnectIntervalSeconds: 5
      groupTriggerPrefix: ""
      # outbound group needs metadata.isGroup=true

  agents:
    defaults:
      defaultAgentId: "default"

  bindings: 

