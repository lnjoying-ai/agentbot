  heartbeat:
    enabled: true
    intervalSeconds: 60
  cron:
    enabled: true
    defaultIntervalSeconds: 60
    defaultPrompt: ""
  ops:
    logBufferSize: 200
    chatStreamBufferSize: 50
    chatMode: "qa"

  security:
    auth:
      enabled: false
      username: "lnjoying"
      password: "Ilovelnjoying2045!"

  search:

    type: "bocha"
    braveApiKey: ""
    bochaApiKey: ""
    apimeshKey: ""

  approvals:
    tools:
      security: "full"     # deny | allowlist | full
      ask: "on-miss"       # off | on-miss | always  
      askFallback: "deny"  # deny | allow  
      uiChannels:
        - "web"
      allowlist:
        - tool: "shell"
          match:
            command: '/^(ls|pwd|dir)(\\s|$).*/'
  browser:
    enabled: true
    controlPort: 18791
    defaultProfile: "agentbot"
    headless: true
    noSandbox: false
    attachOnly: false
    remoteCdpTimeoutMs: 15000
    sandboxBridgeUrl: ""
    nodeBridgeUrl: ""
    executablePath: ""  #C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe
    profiles:
      agentbot:
        driver: "agentbot"
        userDataDir: ""
        cdpUrl: ""
        color: "#FF4500"
      chrome:
        driver: "extension"
        userDataDir: "chrome"
        cdpUrl: "http://127.0.0.1:18792"
        color: "#00AA00"
    antiBot:
      level: "enhanced" # basic | enhanced | advanced
      userAgent: ""
      locale: "zh-CN"
      timezoneId: "Asia/Shanghai"
      headers:
        Accept-Language: "zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7"
      blockResourceTypes:
        - "image"
        - "font"
        - "media"
      blockUrlPatterns:
        - "*://*/*analytics*"
        - "*://*/*gtag*"
        - "*://*/*ads*"
      proxies: []
      enableBehavior: true
      enableDetection: true
      enableStealth: true
      enableResourceBlock: true

  p2p:
    enabled: true
    port: 19031

    peersFile: "peers.yml"
    maxNeighbors: 8
    getaddrLimit: 50
    getaddrIntervalSeconds: 600
    getaddrSampleRatio: 0.5
    getaddrMaxPerMinute: 60
    getaddrBackoffMaxSeconds: 1800
    refreshSeconds: 900
    persistSeconds: 900
    skillExchangeEnabled: true
    skillInvIntervalSeconds: 600
    skillInvSampleRatio: 0.5
    skillInvMaxPerRound: 100
    skillGetdataMaxPerMinute: 120
    skillMaxPackageBytes: 2097152

    seeds: []

    regionId: "default"
    protocolVersion: 1
    maxPayload: 1048576
    requireEncryption: true
    preferredCipherSuite: "CHACHA20_POLY1305"
    preferredContentType: "application/json"
    supportedContentTypes:
      - "application/json"
      - "application/cbor"
      - "application/x-protobuf"
    supportedCompression:
      - "none"
    supportedCipherSuites:
      - "AES_GCM_256"
      - "CHACHA20_POLY1305"
    authRequired: false
    obfuscationEnabled: true
    obfuscationAlgo: "elligator-swift-lite"
    flowWindow: 1024
    maxInFlight: 256
    idempotentWindow: 10000
    
  llm:
    provider: "apimesh"
    temperature: 1
    fallbackOrder: "kimi,glm,minimax,qwen"
    maxToolRounds: 30
    parallelTools: true
    toolParallelism: 3
    logHttpRequest: false
    logHttpResponse: true
    apimesh:
      apiKey: ""
      baseUrl: "https://api.apimesh.io/v1/chat/completions"
      model: "kimi-k2.5"

    kimi:
      apiKey: ""
      baseUrl: "https://api.moonshot.cn/v1/chat/completions"
      model: "kimi-k2.5"
    glm:
      apiKey: ""
      baseUrl: "https://open.bigmodel.cn/api/paas/v4/chat/completions"
      model: "glm-4.7"
    minimax:
      apiKey: ""
      baseUrl: "https://api.minimaxi.com/v1/chat/completions"
      model: "MiniMax-M2.5"
    qwen:
      apiKey: ""
      baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
      model: "qwen-max"
    openrouter:
      apiKey: ""
      baseUrl: "https://openrouter.ai/api/v1"
      model: "openai/gpt-5.2"
    openai:
      apiKey: ""
      baseUrl: ""
      model: "gpt-5.2"
      
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    com.agentbot: DEBUG
    org.apache.hc.client5.http.wire: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG





